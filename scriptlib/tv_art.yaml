description: >-
  Show an image on the living-room Samsung Frame TV's Art Mode, switch Art
  Mode on or off, or report what it is showing. `show` uploads an image from
  your workspace and replaces the previous one this script put there.
run: tv_art.sh
# What running it does (effects.h): the living-room TV (status only reads, but one class covers the script). A tainted run proposes an
# external script instead of running it.
effects: external
timeout_seconds: 120
params:
  - name: action
    description: status | show | artmode_on | artmode_off
    type: string
    required: true
    choices: [status, show, artmode_on, artmode_off]
  - name: image
    description: For action=show only. A .jpg/.jpeg/.png path relative to your workspace (e.g. art/today.jpg).
    type: string
    required: false
  - name: keep
    description: For action=show only. Keep the previously shown image on the TV instead of deleting it.
    type: boolean
    required: false
output:
  format: json
  schema:
    type: object
    required: [ok, action, artmode, content_id]
    properties:
      ok:         {type: boolean}
      action:     {type: string}
      artmode:    {type: string}
      content_id: {type: string}
# The sandbox (src/core/sandbox.h) grants the caller's workspace and this
# directory; the pairing token, its upload state and the weather cache live in
# data/tv, next to FUNES_TV_TOKEN_FILE. Move the token elsewhere and this has
# to follow it.
# connect: the TV's websocket API (learned with `funes script-learn`, 7.9;
# wake-on-LAN is UDP, which Landlock does not restrict).
access:
  write: ["${FUNES_ROOT}/data/tv"]
  connect: [8002]

env:
  FUNES_TV_HOST: "${FUNES_TV_HOST}"
  FUNES_TV_TOKEN_FILE: "${FUNES_TV_TOKEN_FILE}"
  FUNES_TV_MAC: "${FUNES_TV_MAC}"
  FUNES_TV_BROADCAST: "${FUNES_TV_BROADCAST}"
