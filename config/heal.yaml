# =============================================================================
# config/heal.yaml — what Funes does when a health check fails (self-healing H2)
# =============================================================================
# Read by the server (src/core/heal.h) and re-read when this file changes; no
# model involved. When a probe opens an incident, the first rule whose `when`
# matches its key ("probe_services:llm", "jobs:7"; a trailing * is a prefix)
# decides, by `level`:
#
#   observe  only the notice
#   explain  the notice says what a person should do (`explain:`)
#   propose  the call is stored as a proposal: «aprobar N» runs it
#   act      the call runs at once and the notice says what was done. At most
#            twice per incident in 24 h — after that it proposes — and at most
#            `max_per_day` times per rule (default 3).
#
# A call is a tool an agent already has (`agent`, `tool`, `args`), run with
# that agent's grants, like any approved proposal. "${match}" in args is what
# the * matched. propose/act need `undo: none`: in H2 only calls that leave
# nothing to put back (a restart, a retry). Anything that needs sudo, a
# credential or the GPU is `explain` — a person does it.
#
# This file is the admin's, like the agents: nothing Funes runs can write it.
# Raise a level when a rule has earned it (docs/self-healing-plan.md, "the
# ladder").
# =============================================================================

rules:
  # Funes's own number. If it is down, no notice reaches anyone — including the
  # one that would propose restarting it — so this one acts.
  - when: "probe_services:bridge-funes"
    level: act
    action: reiniciar el bridge de WhatsApp de Funes (whatsapp-bridge-funes)
    agent: sysadmin
    tool: run_script
    args: {name: restart_unit, arguments: {unit: whatsapp-bridge-funes}}
    undo: none

  - when: "probe_services:bridge-personal"
    level: propose
    action: reiniciar el bridge de WhatsApp personal (whatsapp-bridge)
    agent: sysadmin
    tool: run_script
    args: {name: restart_unit, arguments: {unit: whatsapp-bridge}}
    undo: none
    explain: "Si después de reiniciarlo sigue caído, puede haberse deslogueado: hay que volver a escanear el QR (journalctl --user -u whatsapp-bridge)."

  - when: "jobs:*"
    level: propose
    action: volver a correr el job
    agent: operator
    tool: run_job_now
    args: {id: "${match}"}
    undo: none
    explain: "Mirá antes por qué falló (preguntale a Funes «¿qué incidentes hay?» o list_jobs). Un newsletter que ya salió no se manda dos veces."

  - when: "probe_services:llm"
    level: explain
    explain: "llama-server no responde en :8080, y sin él Funes no puede contestar. Funes no lo reinicia: usa la GPU del chat. En yoda: `~/launch_llama.sh status`, y si hace falta `~/launch_llama.sh restart big`."

  - when: "probe_services:embeddings"
    level: explain
    explain: "El servidor de embeddings (:8081) no responde: la memoria cae a búsqueda por palabras hasta que vuelva. En yoda: `~/launch_llama.sh status`; `~/launch_llama.sh restart embed`."

  - when: "probe_services:disk"
    level: explain
    explain: "Pedile a Funes que el sysadmin mire qué ocupa el disco (disk_usage). Los backups viejos se borran con prune_backups: primero en dry_run."

  - when: "probe_internet:internet"
    level: explain
    explain: "Si la ruta por defecto es el cable (enp12s0), el problema es la salida de anakin: `nmcli -f ipv4.never-default con show enp12s0` tiene que decir yes. Si es wlan0, es el router."

  - when: "probe_newsletter:linkedin_token"
    level: explain
    explain: "Abrí el link de renovación que manda `linkedin_token.py` por WhatsApp (o en yoda: `python3 ~/Funes/publishing/linkedin_token.py url`) y aprobá la app."

  - when: "probe_newsletter:linkedin_posts"
    level: explain
    explain: "El error está en data/newsletter/post_log.txt. Si es el token, renovalo; un slot se puede reintentar a mano: `python3 publishing/post_tweet.py N --dir data/newsletter` (y `--publication ai-pulse-es` para el español)."
