# =============================================================================
# config/funes.conf — Funes defaults (version-controlled)
# =============================================================================
# Put secrets and machine-local overrides in config/funes.local (gitignored).
# Shell environment variables always take precedence over both files. Neither
# file is put into the environment (7.8): children inherit none of it.

# ── LLM backend ───────────────────────────────────────────────────────────────
# Any OpenAI-compatible endpoint (llama-server, Groq, OpenAI...) or Anthropic.
#   Cloud (Anthropic):  FUNES_LLM_URL=https://api.anthropic.com
#                       FUNES_LLM_PROVIDER=anthropic
#                       FUNES_LLM_MODEL=claude-haiku-4-5-20251001
#                       FUNES_LLM_KEY=sk-ant-...          (set in funes.local!)
#   Local (llama.cpp):  FUNES_LLM_URL=http://localhost:8080
#                       FUNES_LLM_PROVIDER=openai
FUNES_LLM_URL=http://localhost:8080
FUNES_LLM_PROVIDER=openai
FUNES_LLM_MODEL=default

# ── Vision model (optional) ──────────────────────────────────────────────────
# A separate LLM endpoint with a vision-capable model (--mmproj loaded).
# When set, image-bearing user messages route to this model for the first
# completion (image understanding), then switch back to the main model for
# follow-up reasoning and tool calls. Unset (the default) = images go to the
# main model, which is correct unless you actually run a second endpoint.
FUNES_VISION_URL=

# Newsletter, Gmail, WhatsApp, TV and news-feed settings are at the end of
# this file.

# ── Web search ────────────────────────────────────────────────────────────────
# web_search uses the Tavily Search API (free tier: 1,000 searches/month,
# api.tavily.com — built for LLM/agent use, supports topic="news" +
# time_range="day" for recency-filtered queries).
# Without a key, web_search returns a clear "not configured" error instead of
# failing silently or falling back to scraping (DuckDuckGo's HTML endpoint now
# CAPTCHA-blocks scraped requests, so that's no longer an option).
#   FUNES_TAVILY_API_KEY=...   (set in funes.local!)
#
# FUNES_SEARCH_BACKEND=parallel tries Parallel's free search MCP first
# (search.parallel.ai/mcp, no account needed): query-focused excerpts instead
# of Tavily's generic extract, with dates. Tavily stays the fallback, so keep
# its key — a Parallel outage or rate limit then degrades instead of failing.
# Anything other than "parallel" means Tavily only. A Parallel key is optional
# and only raises its rate limits.
FUNES_SEARCH_BACKEND=tavily
#   FUNES_PARALLEL_API_KEY=...  (optional, funes.local)
#   FUNES_PARALLEL_URL=https://search.parallel.ai/mcp

# ── Embeddings (semantic memory) ──────────────────────────────────────────────
# Any OpenAI-compatible /v1/embeddings endpoint:
#   Local:  llama-server -m nomic-embed-text-v1.5.Q4_K_M.gguf --port 8081 --embedding
#   Cloud:  FUNES_EMBED_URL=https://api.openai.com  FUNES_EMBED_KEY=sk-...
# If unset or unreachable, Funes still works — memory falls back to keyword search.
FUNES_EMBED_URL=http://localhost:8081
FUNES_EMBED_MODEL=default

# ── Memory recall ─────────────────────────────────────────────────────────────
# How many memories get pre-injected into context per answer, before
# source_weight ranking (src/core/memory.cpp) even runs. Raised from the
# default of 4: at 4, a genuinely on-topic "auto" conversation log could
# still crowd out a short, more useful "user"/"tool" fact even after
# weighting — see the README's memory-recall-ranking note. More headroom
# costs a bit of context per turn but every agent already has room for it.
FUNES_MEMORY_RECALL_K=6

# ── Server ────────────────────────────────────────────────────────────────────
# Loopback by default: a fresh install is reachable from the machine it runs on
# and nowhere else. Every /api/ route requires authentication, but binding to
# every interface is a decision about the network an install sits on, not a
# default a config file should make for it. Put FUNES_HOST=0.0.0.0 in
# funes.local (or the service unit) when you want it on the LAN.
FUNES_HOST=127.0.0.1
FUNES_PORT=8484

# ── Paths ─────────────────────────────────────────────────────────────────────
# Everything the server and its scripts write goes under data/ in this
# checkout (gitignored). FUNES_DATA_DIR moves the whole thing; FUNES_DB and
# FUNES_WORKSPACE_DIR move one piece. Defaults shown.
# FUNES_DATA_DIR=./data
# FUNES_DB=./data/memory.db
# FUNES_WORKSPACE_DIR=./data/workspace
# Colon-separated: all are loaded; a later directory's agent replaces an
# earlier one with the same name; create_agent writes into the first.
# FUNES_AGENTS_DIR=./agents
# FUNES_UI_DIR=./ui
# The central script library: the only place run_script starts anything from,
# and outside every workspace so no agent-driven tool can read or add a script.
# Colon-separated like FUNES_AGENTS_DIR: later directories shadow earlier ones
# by script name. See scriptlib/README.md.
# FUNES_SCRIPTS_DIR=./scriptlib

# ── Users & authentication (4.0) ─────────────────────────────────────────────
# Every /api/ route except login, /api/auth/status and /api/auth/bootstrap
# requires a logged-in user. There is no self-registration: the first admin is
# created from the web UI's first-run screen (or `funes useradd <name> --admin`),
# and that admin creates everyone else.
#
#   funes useradd <username> [--admin] [--name "Display Name"]
#   funes userlist / userdel / passwd
#
# Shared secret for non-browser callers — currently just the WhatsApp
# autoresponder, which sends it alongside the sender's jid so Funes can resolve
# which user the message belongs to. Belongs in funes.local, NOT here: this
# file is committed. Generate one with:  openssl rand -hex 32
# FUNES_SERVICE_TOKEN=
#
# Map a WhatsApp number to a Funes user, so its messages reach that user's
# memories rather than nobody's:
#   funes jid-map 5511999999@s.whatsapp.net alice
# This is identity, not permission — an extension that answers messages
# decides separately which senders it will answer at all
# whether the autoresponder replies at all.
#
# Add "; Secure" to the session cookie. Leave off for the default plain-HTTP
# LAN deployment (the browser would refuse to store the cookie and login would
# fail); set to 1 when Funes sits behind an HTTPS reverse proxy.
# FUNES_COOKIE_SECURE=0

# A chat stream that stays silent while the model works gets a ": ping"
# comment this often (seconds), so a phone network or proxy does not close it
# as idle. A dropped stream no longer stops the run either way (7.16).
# FUNES_SSE_HEARTBEAT_SECONDS=15

# ── Agents ────────────────────────────────────────────────────────────────────
FUNES_DEFAULT_AGENT=funes

# ── External MCP servers (optional, semicolon-separated URLs) ────────────────
# FUNES_MCP_SERVERS=http://localhost:9000;http://localhost:9001

# stdio MCP servers (an agent YAML's `command:`) are kept running between agent
# runs and leased to one run at a time (src/core/mcp_pool.h). An idle one is
# stopped after FUNES_MCP_IDLE_SECONDS; at most FUNES_MCP_POOL_IDLE_MAX idle
# copies of one server are kept. FUNES_MCP_KEEP_ALIVE=0 starts and stops each
# server per run, as before 7.10.
# FUNES_MCP_KEEP_ALIVE=1
# FUNES_MCP_IDLE_SECONDS=600
# FUNES_MCP_POOL_IDLE_MAX=2

# Arbitrary command execution (execute_shell, shell cron jobs). Note this does
# NOT gate run_script: a script in the library is a reviewed file an admin
# installed and an agent was granted by name, which is a narrower thing than a
# command line the model writes. That is the point of the split -- an agent
# that only needs one known program does not need this switch at all.
# Off by default since 5.0.1: a fresh install should not ship with model-driven
# code execution on. Turn it on per machine, in funes.local, once you have
# read the note in src/core/tools/shell_tool.cpp. A member account also needs
# execute_shell granted explicitly (`funes perms`) — the switch alone is not
# enough for anyone but an admin, and that includes scheduled shell jobs.
FUNES_ALLOW_SHELL=0

# What a child process (library script, shell command, MCP stdio server) may
# see. Since 7.8 this file and funes.local are read into a private map, not
# the environment (src/core/funes_config.h), and children get an allowlist on
# top (PATH, HOME, locale, proxies, Python/CA plumbing — see
# proc::child_environment in src/core/tools/process_runner.cpp): no FUNES_*
# variable, no API key, no service token. Name any
# extra variables a child genuinely needs here, comma-separated. Prefer a
# script manifest's `env:` or an MCP server's `env:` — those hand one program
# one secret; this hands it to all of them.
# FUNES_CHILD_ENV=SMTP_PASSWORD,LINKEDIN_TOKEN

# ── A cgroup per child process (7.4, src/core/cgroup.h) ─────────────────────
# 1: every script, shell command, scheduled shell job and pdftotext run gets
# a cgroup of its own — limits the kernel enforces, a kill a setsid'd or
# double-forked grandchild cannot escape, and its peak memory / CPU time / OOM
# kill printed on the call's [tool] line. Needs a cgroup systemd handed over:
# scripts/funes.service sets Delegate=yes and this to 1. Anywhere else (a
# hand-run, a terminal, a unit without Delegate=yes) it is refused at startup
# and children run as before. MCP stdio servers are not covered yet.
# FUNES_CGROUPS=0
# Per-child defaults; a script manifest's `limits:` overrides them
# (memory_mb, pids, cpu_weight). 0 turns one off. cpu.weight 50 against the
# server's 100: a tool call yields the CPU to the person waiting on chat.
# FUNES_CHILD_MEMORY_MB=4096
# FUNES_CHILD_PIDS_MAX=512
# FUNES_CHILD_CPU_WEIGHT=50

# ── Child-process sandbox (7.5, src/core/sandbox.h) ─────────────────────────
# Landlock + seccomp on every script, shell command, scheduled shell job and
# PDF tool run: the system read-only, the caller's workspace and a private
# temp directory read-write, plus a script manifest's `access:` — the kernel
# refuses the rest (funes.local, memory.db, other accounts' files, /tmp). On
# whenever the kernel has Landlock; startup prints the ABI. 0 turns it off,
# which is a decision to run model-driven code with this account's whole
# filesystem.
# FUNES_SANDBOX=1
# Learn mode (7.9, src/core/observe.h): what `funes script-learn`, `funes
# mcp-probe --learn` and a `learn: true` manifest record, one <owner>.jsonl
# each. Default: a `learn` directory beside the workspace root (data/learn).
# FUNES_LEARN_DIR=

# ── Local socket (7.8, src/server/local_socket.h) ───────────────────────────
# funes.sock: programs on this machine talk to Funes with no password or
# token — the kernel names the caller's uid (SO_PEERCRED) and an admin maps it
# to an account: `funes uid-map julio julio`. Unmapped uids are refused, and
# so are Funes's own child processes (scripts, shell commands, MCP servers)
# whatever uid they run as. Mode 0600. `funes ask` is the client:
#   journalctl --user -u funes -n 200 | funes ask "what went wrong"
# With a question, a stdin silent for 3 s (plain ssh, cron) is skipped; `funes
# ask - "why"` waits for a slow command's output instead.
# Default $XDG_RUNTIME_DIR/funes.sock; "off" disables it. (`funes ask` reads
# only the environment, so set FUNES_SOCKET there too if you move it.)
# FUNES_SOCKET=

# ── Machine memory (7.7, src/core/host_collector.h) ─────────────────────────
# The box Funes runs on remembers what happens to it: a collector reads the
# user journal (unit failures, restarts, OOM kills), /var/log/dpkg.log, boot
# and kernel changes, the llama-server pid files, edits to watched files, PSI,
# temperatures, VRAM and disks, and every child's CPU cost. Changes and
# failures become memories of a `machine` system account (nobody can log in
# as it), embedded and linked to the change before each failure; admins read
# them with host_changes and machine_recall. Reads only — it never changes
# anything on the machine.
# FUNES_MACHINE_MEMORY=on
# Seconds between ticks (samples are taken every fifth minute regardless).
# FUNES_MACHINE_POLL=60
# A runaway guard, not a ration: memories per day before promotion pauses.
# Events are still recorded and host_changes still sees them.
# FUNES_MACHINE_PROMOTIONS_PER_DAY=200
# How long samples are kept; changes and failures are kept four times longer.
# FUNES_MACHINE_EVENT_DAYS=30
# What edits count as changes (colon-separated; directories are not
# recursive). Default: ~/.config/systemd/user, ~/launch_llama.sh, config/.
# FUNES_MACHINE_WATCH=
# FUNES_MACHINE_LLAMA_PIDS=/tmp/llama_pids

# ── Self-healing probes (7.18, src/core/probes.h, docs/self-healing-plan.md) ─
# Health checks on a timer: library scripts with a `probe:` block (probe_*
# in scriptlib/) and the scheduled jobs' last runs. A failing check opens one
# incident; every admin with a mapped WhatsApp number (`funes jid-map`) gets
# a message from Funes's number when it opens and when it closes. Admins read
# them with the `incidents` tool. Reads only — nothing is repaired yet (H2+).
# FUNES_PROBES=on
# No notices in these local hours (critical ones excepted); they go out after.
# FUNES_INCIDENT_QUIET_HOURS=23-8
# Seconds after startup before the first round (a model may still be loading).
# FUNES_PROBES_DELAY=90
# The personal-number bridge, for probe_services (absent = not checked).
# WHATSAPP_PERSONAL_BRIDGE_URL=http://localhost:8090

# ── The guardian (7.19, src/core/guardian.h, scripts/funes_guardian.py) ───────
# Snapshots what Funes changes in its own installation (today: create_agent's
# agents/*.yaml) before the write, watches the change, and puts it back when
# Funes stops answering or an incident opens — or on "deshacer N" from an
# admin (web chat, funes ask, or WhatsApp to Funes's number). On by default
# when scripts/funes_guardian.py is in the checkout; the funes-guardian.timer
# unit does the watching.
# FUNES_GUARDIAN=on
# What to do when an incident opens (7.20, src/core/heal.h): explain, propose
# («aprobar N») or act, per incident key. Re-read when it changes.
# FUNES_HEAL_POLICY=config/heal.yaml
# The doctor (7.21, src/core/doctor.h): a model picks a runbook from heal.yaml's
# catalog for an incident no rule covers — only ever proposed. At most this many
# diagnoses a day.
# FUNES_DOCTOR=on
# FUNES_DOCTOR_PER_DAY=10

# ── Cron (schedule_job / operator, see core/cron_runner.h) ───────────────────
# How often the scheduler checks for due jobs. Lower = more responsive to a
# job scheduled a minute out, at the cost of a DB query that often.
# Set to 0 on a second install that opened a copy of another's database:
# scheduled jobs come across with the data and will otherwise fire from both.
# FUNES_CRON_ENABLED=1
# FUNES_CRON_POLL_SECONDS=30
# Timeout for a scheduled kind="shell" job, in seconds — separate from
# execute_shell's own timeout_seconds since nothing is waiting on a scheduled
# job synchronously, so a longer default is fine. A kind="script" job uses its
# own manifest's timeout_seconds instead, and needs no shell access at all.
# FUNES_CRON_SHELL_TIMEOUT=120

# ── Connected memories (5.0, see src/core/memory.h) ──────────────────────────
# Recall expands one hop through explicit links between memories and unions in
# full-text term matches. Both only ever *add* candidates below what the
# similarity search already found, so this needs no switch — with no links and
# no term matches, recall behaves exactly as it did in 4.x.
#
# What does need a switch is where links come from: a background pass that asks
# the model, for one candidate pair at a time, whether two memories are
# connected. It is one model call per pair and it shares a GPU with the chat
# path, so each call first waits until no agent run is in flight and CPU/IO
# pressure is low (src/core/busy_gate.h) — a person waits behind at most one
# one-word judgment. That made it safe to default on (7.0; it was off before).
# The first sweep of a few hundred memories takes a few hours, spread over
# several runs, and every verdict is recorded so a later run never re-asks.
# FUNES_LINK_BACKFILL=on
# FUNES_LINK_HOURS=12
# FUNES_LINK_MAX_ANCHORS=40
# A "contradicts" verdict also retires the older of the two memories (7.2):
# it leaves recall, stays in the table, and the memory panel can restore it.
# A memory from a web page or email never retires one that isn't, and only a
# memory you taught by hand retires another you taught by hand.

# ── What a conversation leaves in memory (7.2, src/core/fact_extraction.h) ───
# extract (default): each exchange is queued, and a background pass asks the
#   model which lasting facts it established — usually none. Only those are
#   stored (source "extracted"); the transcript stays in the history either way.
# log: the pre-7.2 behaviour, one `User said … I replied …` memory per exchange.
# 0: nothing.
# Each extraction call waits for busy_gate like the link backfill, and only
# exchanges older than FUNES_EXTRACT_MIN_AGE seconds are taken, so a
# conversation in progress doesn't compete with its own memory for the GPU.
# FUNES_AUTO_MEMORY=extract
# FUNES_EXTRACT_POLL=60
# FUNES_EXTRACT_MIN_AGE=120
# FUNES_EXTRACT_MAX_ITEMS=20
# The worker also runs in log mode, but then only for what
# `funes memory-migrate --apply` queued: the stored exchange logs, each
# archived (kept, out of recall) once its facts are extracted (7.3).
#
# Consolidation archives extracted facts and exchange logs that no reply has
# ever drawn on (src/core/citation.h) and nothing links to, once they are older
# than this — counted from when citation tracking began on this database, so
# upgrading archives nothing at once. Archived, not deleted.
# FUNES_ARCHIVE_UNCITED_DAYS=90


# ── Newsletter / VoC pipeline (src/julio, publishing/, publications/) ───────
# Each defaults to the checkout's own directory (FUNES_ROOT, baked in at build
# time), so these are only needed to point somewhere else. The newsletter's
# output — issues, harvests, images, logs, and the .env holding the X/SMTP
# credentials the sending scripts read — is data/newsletter/ (FUNES_PUBLISH_DIR
# for the shell/Python side; curator.yaml's workspace_dir for the agent).
# FUNES_PUBLICATIONS_DIR=./publications
# FUNES_PIPELINES_DIR=./pipelines
# FUNES_PUBLISHING_DIR=./publishing
# FUNES_PUBLISH_DIR=/home/julio/Funes/data/newsletter
#
# Children do not inherit the server's environment (5.0.1), so a credential
# publish_issue.py / send_newsletter.py needs at send time belongs in
# data/newsletter/.env, or is named in FUNES_CHILD_ENV.

# ── Email (Gmail) ─────────────────────────────────────────────────────────────
# Read by publishing/send_newsletter.py (SMTP send) and the gmail-assistant
# agent's imap-email-mcp server (IMAP search/read/draft) — same Gmail account,
# one Google App Password covers both. Generate one at:
# https://myaccount.google.com/apppasswords (requires 2FA).
#   GMAIL_ADDRESS=you@gmail.com        (set in funes.local!)
#   GMAIL_APP_PASSWORD=...             (set in funes.local!)
#   IMAP_USER=you@gmail.com            (set in funes.local!, same as GMAIL_ADDRESS)
#   IMAP_PASSWORD=...                  (set in funes.local!, same as GMAIL_APP_PASSWORD)
# GMAIL_* reach send_newsletter.py only through <publish dir>/.env now (or
# FUNES_CHILD_ENV=GMAIL_ADDRESS,GMAIL_APP_PASSWORD); IMAP_* reach the MCP
# server through agents/gmail-assistant.yaml's env: block, which expands them.

# ── WhatsApp ──────────────────────────────────────────────────────────────────
# Two independent WhatsApp numbers, two independent bridge instances of the
# same binary (third-party/whatsapp-mcp/whatsapp-bridge) — see the README's
# WhatsApp section, scripts/whatsapp-bridge.service, and
# scripts/whatsapp-bridge-funes.service.
#
#   Personal number  → whatsapp-bridge.service       → port 8090, data/whatsapp/store/
#     Used by whatsapp-assistant (Funes checking/sending from your own
#     WhatsApp when you ask it to, via the whatsapp-mcp-server MCP layer —
#     its WHATSAPP_API_BASE_URL is hardcoded to 8090, no config needed here).
#   Dedicated Funes number → whatsapp-bridge-funes.service → port 8091, data/whatsapp/store-funes/
#     Used only by scripts/whatsapp_autoresponder.py (not by the funes
#     binary itself), via the two settings below.
# The dedicated number's store defaults to data/whatsapp/store-funes/messages.db
# (and the poller's watermark to data/whatsapp/), so only the URL is set here.
WHATSAPP_BRIDGE_URL=http://localhost:8091

# ── LinkedIn token renewal (publishing/linkedin_token.py) ────────────────────
# Where LinkedIn sends the browser after the app is approved again: tailscale
# funnel's /linkedin path on this host, proxied to linkedin-callback.service.
# Must also be listed under Auth → redirect URLs in the LinkedIn app. Per
# host, so it goes in funes.local:
#   LINKEDIN_REDIRECT_URI=https://<host>.<tailnet>.ts.net/linkedin/callback
# Who gets the WhatsApp reminder; default: the jid mapped to the first admin.
# LINKEDIN_ALERT_JID=
# LINKEDIN_CALLBACK_PORT=8492

# WHATSAPP_WHITELIST is a comma-separated list of chat_jid values (NOT phone
# numbers — WhatsApp increasingly assigns opaque "@lid" ids instead of
# "<phone>@s.whatsapp.net", so matching by chat_jid is the only reliable
# option), looked up against the dedicated-number instance above. Only
# messages from chats on this list get an auto-reply; every other chat is
# silently ignored. Manage it with scripts/whatsapp_whitelist.py instead of
# hand-editing this file:
#   python3 scripts/whatsapp_whitelist.py list
#   python3 scripts/whatsapp_whitelist.py add <name-or-jid-substring>
#   python3 scripts/whatsapp_whitelist.py remove <name-or-jid-substring>
# (restart whatsapp-autoresponder.service after either command)
# Whitelisting a group chat (jid ending in @g.us) means auto-replying to
# every message anyone posts there — probably not what you want; `add`
# refuses groups unless you pass --allow-group.
#   WHATSAPP_WHITELIST=<chat_jid>,<chat_jid>   (set in funes.local!)

# Which agent answers depends on the sender's role, resolved from their jid by
# Funes (`funes jid-map <jid> <username>`). Funes has its own number, so you
# messaging your own assistant arrives looking exactly like a contact — and
# before 4.0 you got the same declawed whatsapp-autoresponder a stranger gets:
# memory and read_file, no delegation, so it correctly reported it could not
# read your email even with gmail-assistant loaded one delegation away. An
# admin now gets WHATSAPP_ADMIN_AGENT instead; every other role keeps
# whatsapp-autoresponder.
#
# This is only routing. It grants nothing: the server resolves the user from
# the jid and applies that user's own agent and tool allowlists, so pointing a
# member at a fuller agent would just be refused. Widen or narrow what an admin
# can reach over WhatsApp with `funes user permissions`, not here.
#   WHATSAPP_ADMIN_AGENT=funes
# `funes` answers at web-UI length; if that reads as an essay on a phone, point
# this at your own agent yaml with a shorter-replies prompt.

# Documents ("document" attachments — PDFs and plain text files) and photos
# ("image" attachments; audio/video are still ignored) sent by a whitelisted
# contact are downloaded and copied here so whatsapp-autoresponder's
# read_file tool can analyze them (see workspace_dir in
# agents/whatsapp-autoresponder.yaml) — images need a vision-capable LLM
# backend (--mmproj loaded) to actually be read, not just downloaded.
# Files older than WHATSAPP_UPLOAD_MAX_AGE_DAYS are deleted automatically.
#
# 4.0: uploads land inside the *sending contact's own* Funes workspace —
# $FUNES_WORKSPACE_DIR/<user_id>/whatsapp-uploads/ — because that is the only
# place that user's read_file may look. The number has to be mapped to a user
# first (`funes jid-map <jid> <username>`); an unmapped number's attachments
# are ignored, the same as its messages.
#
# WHATSAPP_UPLOAD_SUBDIR is the folder name inside each user's workspace and
# must match `workspace_dir` in agents/whatsapp-autoresponder.yaml — change
# both or neither. (It replaces the pre-4.0 WHATSAPP_UPLOAD_DIR, which named
# one shared directory for everybody.)
# Defaults shown; uncomment to override in funes.local.
# An attachment's path is handed to the agent relative to *its* workspace root:
# bare for whatsapp-autoresponder (whose workspace_dir is the upload folder),
# prefixed with WHATSAPP_UPLOAD_SUBDIR for an admin agent that declares no
# workspace_dir and is rooted one level up. Same file either way.
#   WHATSAPP_UPLOAD_SUBDIR=whatsapp-uploads
#   WHATSAPP_MAX_MEDIA_BYTES=20971520
#   WHATSAPP_UPLOAD_MAX_AGE_DAYS=30


# ── home agent: the living-room TV (scriptlib/tv_art) ─────────────────────────
# The Samsung Frame's address (reserve it in the router's static DHCP) and
# where its pairing token is kept — outside every workspace, so no agent-driven
# tool can read it. The first run shows an "Allow?" prompt on the TV; accept it
# once with the remote. Revoke in the TV's Settings → General → External
# Device Manager → Device Connection Manager.
#   FUNES_TV_HOST=192.168.1.55
# Absolute (the script runs with cwd = a workspace). tv_weather_art keeps its
# cache in a tv_weather_art/ directory beside this file.
#   FUNES_TV_TOKEN_FILE=/home/julio/Funes/data/tv/samsung_tv_token
# The Frame drops off the network when Art Mode blanks the screen; with its MAC
# set, tv_art sends Wake-on-LAN and retries. Needs the TV's "Power On with
# Mobile" (Settings → General → External Device Manager) switched on.
#   FUNES_TV_MAC=c8:12:0b:1c:91:7a
# Where the "art and weather" picture (scriptlib/tv_weather_art) gets its
# forecast from. Coordinates from Open-Meteo's geocoding; the place name is
# what the placard prints.
#   FUNES_WEATHER_LAT=-34.51236
#   FUNES_WEATHER_LON=-58.5458
#   FUNES_WEATHER_PLACE=Villa Adelina


# ── speak: the living-room Echo as a speaker (scriptlib/speak) ────────────────
# The Echo's Bluetooth *audio* address — pair it with the host first
# (bluetoothctl pair/trust/connect); the right one is the address whose
# `bluetoothctl info` lists "Audio Sink" (the other, a BLE address, is not it).
# Needs espeak-ng and PulseAudio (pulseaudio-module-bluetooth) on the host.
#   FUNES_ECHO_MAC=78:6C:84:CB:44:AF
# Hours (local time) when nothing is spoken; "off" disables. Default 23:00-07:00.
#   FUNES_SPEAK_QUIET=23:00-07:00


# ── noticiero: the Echo's morning news feed (scriptlib/publish_briefing) ──────
# Directory `tailscale funnel` serves; must exist, absolute, outside every
# workspace. feed.json inside it is what the Alexa news skill reads.
#   FUNES_NEWS_FEED_DIR=/home/julio/Funes/data/public/noticias
# The public https URL of that feed.json (the news skill's feed URL).
#   FUNES_NEWS_PUBLIC_URL=https://yoda.<tailnet>.ts.net/noticias/feed.json
